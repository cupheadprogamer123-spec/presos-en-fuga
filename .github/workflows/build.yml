name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python version
        run: |
          python --version
          which python

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip python3.11-venv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install "setuptools<70" wheel cython==0.29.36 virtualenv buildozer

      - name: Download Android NDK 25b
        run: |
          mkdir -p /home/runner/.buildozer/android/platform/
          cd /home/runner/.buildozer/android/platform/
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          mv android-ndk-r25b android-ndk-r25b-custom
          echo "NDK descargado correctamente"

      - name: Build with Buildozer
        env:
          ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r25b-custom
          ANDROID_NDK_PATH: /home/runner/.buildozer/android/platform/android-ndk-r25b-custom
        run: |
          which python
          python --version
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presos-en-fuga-apk
          path: bin/*.apk
