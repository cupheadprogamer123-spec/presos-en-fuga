name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer with pinned Cython
        run: |
          pip install --user --upgrade "pip<24"
          pip install --user "setuptools<60" "wheel<0.45" "cython==0.29.36" buildozer
          python3 -c "import Cython; print('Cython:', Cython.__version__)"

      - name: Download Android NDK 25b
        run: |
          mkdir -p /home/runner/.buildozer/android/platform/
          cd /home/runner/.buildozer/android/platform/
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          mv android-ndk-r25b android-ndk-r25b-custom

      - name: Build with Buildozer
        env:
          ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r25b-custom
          ANDROID_NDK_PATH: /home/runner/.buildozer/android/platform/android-ndk-r25b-custom
          CYTHON_VERSION: 0.29.36
          PIP_NO_BUILD_ISOLATION: 1
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 --version
          buildozer --version
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presos-en-fuga-apk
          path: bin/*.apk
